[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scimcp"
version = "0.1.0"
description = "MCP server for computational materials science — LAMMPS, DFT, and ML-powered analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nour El Haq" },
]
keywords = [
    "mcp",
    "mcp-server",
    "lammps",
    "materials-science",
    "computational-chemistry",
    "molecular-dynamics",
    "dft",
    "mxene",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "mcp[cli]>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "ase>=3.22",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/Nour-elhaq/scimcp"
Repository = "https://github.com/Nour-elhaq/scimcp"
Issues = "https://github.com/Nour-elhaq/scimcp/issues"

[project.scripts]
scimcp = "scimcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scimcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
